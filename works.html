  <!-- Тема сайта. По умолчанию — тёмная (первая версия).
       Светлая открывается по ссылке ?theme=light (и запоминается до закрытия вкладки),
       вернуть тёмную — ?theme=dark. Чтобы сделать светлую основной — поменяйте DEFAULT на 'light'. -->
  <script>
    (function () {
      var DEFAULT = 'dark';
      var t = new URLSearchParams(location.search).get('theme');
      try {
        if (t === 'light' || t === 'dark') sessionStorage.setItem('akiotoo-theme', t);
        else t = sessionStorage.getItem('akiotoo-theme');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' || t === 'dark' ? t : DEFAULT);
    })();
  </script>
