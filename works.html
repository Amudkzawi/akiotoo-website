  <!-- Тема: по умолчанию светлая. Тёмная — по ссылке ?theme=dark (запоминается до закрытия вкладки),
       вернуть светлую — ?theme=light. Сменить тему по умолчанию — DEFAULT ниже (в обоих HTML). -->
  <script>
    (function () {
      var DEFAULT = 'light';
      var t = new URLSearchParams(location.search).get('theme');
      try {
        if (t === 'light' || t === 'dark') sessionStorage.setItem('akiotoo-theme', t);
        else t = sessionStorage.getItem('akiotoo-theme');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' || t === 'dark' ? t : DEFAULT);
      document.documentElement.classList.add('js');
    })();
  </script>
